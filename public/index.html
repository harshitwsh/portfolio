    <!-- Local Mock for Supabase Edge Functions -->
    <script>
      (function() {
        const originalFetch = window.fetch;
        window.fetch = async function(url, options) {
          const urlStr = url.toString();
          if (urlStr.includes('htyygaanbsjnlftloicg.supabase.co')) {
            console.log('[Local Mock] Intercepted Supabase API request:', urlStr, options);
            
            const getMockDb = () => {
              try {
                return JSON.parse(localStorage.getItem('mock_zero_users') || '{}');
              } catch (e) {
                return {};
              }
            };
            const saveMockDb = (db) => {
              try {
                localStorage.setItem('mock_zero_users', JSON.stringify(db));
              } catch (e) {
                console.error('[Local Mock] Failed to save mock users', e);
              }
            };
            
            const db = getMockDb();
            let responseData = {};
            let status = 200;

            try {
              if (urlStr.includes('Join-Zero-Waitlist-Signup')) {
                const body = options && options.body ? JSON.parse(options.body) : {};
                const email = (body.email || '').trim().toLowerCase();
                
                let user = null;
                for (const key in db) {
                  if (db[key].email === email) {
                    user = db[key];
                    break;
                  }
                }
                
                if (user) {
                  responseData = {
                    uuid: user.uuid,
                    already_exists: true,
                    referral_url: user.referral_url,
                    effective_position: user.effective_position,
                    waitlist_number: user.waitlist_number
                  };
                } else {
                  const uuid = 'local-uuid-' + Math.random().toString(36).substring(2, 11);
                  const count = Object.keys(db).length + 1;
                  const waitlist_number = 1000 + count;
                  const effective_position = 450 + count;
                  const referral_url = `https://harshityadavx.vercel.app/?ref=local-ref-${waitlist_number}`;
                  
                  user = {
                    uuid: uuid,
                    email: email,
                    already_exists: false,
                    referral_url: referral_url,
                    effective_position: effective_position,
                    waitlist_number: waitlist_number,
                    waitlist_animal: body.waitlist_animal || '',
                    profile_complete: false,
                    name: '',
                    age: '',
                    location: '',
                    status: '',
                    university: '',
                    about: ''
                  };
                  
                  db[uuid] = user;
                  saveMockDb(db);
                  
                  responseData = {
                    uuid: uuid,
                    already_exists: false,
                    referral_url: referral_url,
                    effective_position: effective_position,
                    waitlist_number: waitlist_number
                  };
                }
              } else if (urlStr.includes('Join-Zero-Beta-Waitlist-Profile')) {
                const body = options && options.body ? JSON.parse(options.body) : {};
                const uuid = body.uuid;
                
                if (uuid && db[uuid]) {
                  db[uuid].name = body.name || '';
                  db[uuid].age = body.age || '';
                  db[uuid].location = body.location || '';
                  db[uuid].status = body.status || '';
                  db[uuid].university = body.university || '';
                  db[uuid].about = body.about || '';
                  db[uuid].profile_complete = true;
                  saveMockDb(db);
                  responseData = { success: true };
                } else {
                  responseData = { success: true };
                }
              } else if (urlStr.includes('Get-Zero-Waitlist-User')) {
                const parsedUrl = new URL(urlStr);
                const uuid = parsedUrl.searchParams.get('uuid');
                
                if (uuid && db[uuid]) {
                  const user = db[uuid];
                  responseData = {
                    profile_complete: user.profile_complete,
                    referral_url: user.referral_url,
                    effective_position: user.effective_position,
                    waitlist_number: user.waitlist_number,
                    name: user.name,
                    age: user.age,
                    location: user.location,
                    status: user.status,
                    university: user.university,
                    about: user.about
                  };
                } else {
                  responseData = {
                    profile_complete: false,
                    referral_url: '',
                    effective_position: 0,
                    waitlist_number: 0,
                    name: '',
                    age: '',
                    location: '',
                    status: '',
                    university: '',
                    about: ''
                  };
                }
              } else if (urlStr.includes('Zero-University-Log-Landing')) {
                responseData = { success: true };
              }
            } catch (err) {
              console.error('[Local Mock] Error processing mock request:', err);
              status = 500;
              responseData = { error: err.message };
            }
            
            return new Response(JSON.stringify(responseData), {
              status: status,
              headers: { 'Content-Type': 'application/json' }
            });
          }
          
          return originalFetch.apply(this, arguments);
        };
      })();
    </script>

      html,

      /* Background gradient on a dedicated fixed div BEHIND the canvas (z 0 <
         canvas z 1). It mirrors the procedural loaderGradient (see main.js
         loaderGradient stops / center / radii) and shows through the
         transparent canvas during the loader (renderer clearAlpha=0). Once the
         WebGL bgPass renders its matching gradient, the opaque canvas covers
         this div — seamless.

         Why a fixed div and not the body background: position:fixed inset:0 is
         sized to the viewport from the very first layout, independent of
         document flow, so the gradient paints on the first frame. Painting it
         on <body> let the solid background-color flash through while the body
         box was momentarily unsized. Radii in vw/vh size the ellipse to the
         viewport; no background-attachment:fixed. */
      #bg-gradient {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-color: rgb(28, 72, 57);
        background-image: radial-gradient(
          ellipse 126.7vw 143.4vh at 50% 130%,
          rgb(212, 246, 235) 15.855%,
          rgb(179, 222, 209) 26.169%,
          rgb(145, 199, 183) 36.483%,
          rgb(112, 175, 156) 46.797%,
          rgb(78, 151, 130) 57.111%,
          rgb(53, 111, 94) 78.555%,
          rgb(28, 72, 57) 100%
        );
      }
      /* Dummy pre-canvas placeholder: a "99" in the bottom-left that paints
         on the very first layout and shows through the transparent canvas
         alongside #bg-gradient while WebGL boots. Same z-index 0 as the
         gradient but later in DOM order, so it paints above it; the opaque
         canvas (z 1) covers it once the first frame renders. Purely
         decorative — no behavior, no pointer events.

         Styled to mirror the real loader counter (LoaderTextOverlay.js):
         700 'Supply Sans' (same stack, monospace fallback pre-font-load),
         white, left-aligned at the same reference ratios — desktop font
         180/1080 of viewport height with a 40/1920 left margin, phone
         (<768px) 110/1080 with an 80/1920 margin, baseline ~40/1080 up
         from the bottom. */
      /* svh (small-viewport) units, NOT vh: the canvas counter sizes itself
         from window.innerHeight, which on phones equals the SMALL viewport
         while the URL bar is visible — i.e. exactly at page load, when this
         placeholder shows. Plain vh measures the LARGE (bar-retracted)
         viewport there, so the DOM 99 rendered bigger/lower than the canvas
         99 drawn over it — the mismatched fringes read as the number being
         "cut" at the top and bottom. Desktop viewports are static, where
         svh === vh, so nothing changes there. */
      #pre-canvas-99 {
        position: fixed;
        left: 2.0833vw; /* 40 / 1920 */
        bottom: 3.7037vh; /* 40 / 1080 (fallback) */
        bottom: 3.7037svh;
        z-index: 0;
        pointer-events: none;
        user-select: none;
        font:
          700 16.667vh/1 'Supply Sans',
          monospace; /* 180 / 1080 (fallback) */
        font-size: 16.667svh;
        color: #ffffff;
      }
      @media (max-width: 767px) {
        #pre-canvas-99 {
          left: 4.1667vw; /* 80 / 1920 */
          font-size: 10.185vh; /* 110 / 1080 (fallback) */
          font-size: 10.185svh;
        }
      }

        display: block;

        height: 100%;
        overflow: hidden;
        background-color: transparent;
      }
      #webgl {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: auto;
        touch-action: none;
      }
      #ui-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
      }
